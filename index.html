<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="theme-btn">다크 모드</button>
        </div>
        <h1>로또 번호 생성기</h1>
        
        <div class="generator">
            <div id="numbers" class="numbers"></div>
            <button id="generate-btn">번호 생성하기</button>
        </div>

        <div class="history">
            <h2>최근 생성 기록</h2>
            <ul id="history-list"></ul>
        </div>

        <div class="contact-form">
            <h2>제휴 문의</h2>
            <form id="inquiry-form" action="https://formspree.io/f/meerzkll" method="POST">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="이름" required>
                    <span class="error-msg" id="name-error"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="이메일" required>
                    <span class="error-msg" id="email-error"></span>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="문의 내용" rows="4" required></textarea>
                    <span class="error-msg" id="message-error"></span>
                </div>
                <button type="submit" id="submit-btn">문의 보내기</button>
            </form>
            <div id="form-success" class="success-msg" style="display: none;">
                감사합니다! 문의가 정상적으로 접수되었습니다. 곧 연락드리겠습니다.
            </div>
        </div>

        <!-- Disqus Comments Section -->
        <div class="comments-section">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
                var disqus_config = function () {
                this.page.url = window.location.href;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = window.location.pathname; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://EXAMPLE-SHORTNAME.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
