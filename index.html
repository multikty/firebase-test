<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="theme-btn">Dark Mode</button>
        </div>
        <h1>Lotto Number Generator</h1>
        
        <div class="generator">
            <div id="numbers" class="numbers"></div>
            <button id="generate-btn">Generate Numbers</button>
        </div>

        <div class="history">
            <h2>History</h2>
            <ul id="history-list"></ul>
        </div>

        <div class="contact-form">
            <h2>Affiliation Inquiry</h2>
            <form id="inquiry-form" action="https://formspree.io/f/multikty@gmail.com" method="POST">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Name" required>
                    <span class="error-msg" id="name-error"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="_replyto" placeholder="Email" required>
                    <span class="error-msg" id="email-error"></span>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="Your Message" rows="4" required></textarea>
                    <span class="error-msg" id="message-error"></span>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
            <div id="form-success" class="success-msg" style="display: none;">
                Thank you! Your inquiry has been sent to multikty@gmail.com.
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
